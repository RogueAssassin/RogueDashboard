services:
  roguedashboard:
    image: ${RGDASH_IMAGE:-ghcr.io/rogueassassin/roguedashboard:latest}
    pull_policy: always
    container_name: roguedashboard
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/bootstrap', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - .env
    environment:
      PORT: 8080
      DATA_DIR: /data
      STATIC_DIR: /app/static
      CUSTOM_DIR: /custom
      RGDASH_RUNTIME: ${RGDASH_RUNTIME:-auto}
    ports:
      - "${RGDASH_PORT:-7805}:8080"
    volumes:
      - ./data:/data
      - ./custom:/custom:ro
    networks:
      media-net:
        aliases:
          - roguedashboard
          - dash
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      rogue.dashboard.protected: "true"
      rogue.product: "RogueDashboard"

networks:
  media-net:
    external: true
    name: ${MEDIA_NETWORK:-media-net}

x-podman:
  in_pod: false
