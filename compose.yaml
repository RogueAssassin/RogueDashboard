services:
  roguedashboard:
    image: ${RGDASH_IMAGE:-ghcr.io/rogueassassin/roguedashboard:latest}
    # "missing" keeps a recreate working when the registry is unreachable (e.g. after a power
    # cut with no internet). ./update.sh always pulls explicitly.
    pull_policy: ${RGDASH_PULL_POLICY:-missing}
    container_name: roguedashboard
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      # Uses /api/ping, which also fails if the background monitor has stalled.
      test: ["CMD", "python", "/app/dashboard.py", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - .env
    environment:
      PORT: 8080
      DATA_DIR: /data
      STATIC_DIR: /app/static
      CUSTOM_DIR: /custom
      RGDASH_RUNTIME: ${RGDASH_RUNTIME:-auto}
    ports:
      # Set RGDASH_BIND=127.0.0.1 when a reverse proxy on the same host/network fronts the dashboard.
      - "${RGDASH_BIND:-0.0.0.0}:${RGDASH_PORT:-7805}:8080"
    volumes:
      # Leave the *_MOUNT_OPTS empty on Docker. Rootless Podman / SELinux hosts: see .env.example.
      - ./data:/data:rw${RGDASH_DATA_MOUNT_OPTS:-}
      - ./custom:/custom:ro${RGDASH_CUSTOM_MOUNT_OPTS:-}
    networks:
      media-net:
        aliases:
          - roguedashboard
          - dash
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${RGDASH_MEM_LIMIT:-256m}
    pids_limit: ${RGDASH_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      rogue.dashboard.protected: "true"
      rogue.product: "RogueDashboard"

networks:
  media-net:
    external: true
    name: ${MEDIA_NETWORK:-media-net}

x-podman:
  in_pod: false
