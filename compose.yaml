services:
  roguedashboard:
    image: ${RGDASH_IMAGE:-ghcr.io/rogueassassin/roguedashboard:1.2.1}
    pull_policy: always
    container_name: roguedashboard
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - .env
    environment:
      PORT: 8080
      DATA_DIR: /data
      STATIC_DIR: /app/static
      CUSTOM_DIR: /custom
      RGDASH_RUNTIME: ${RGDASH_RUNTIME:-auto}
    ports:
      - "${RGDASH_PORT:-7805}:8080"
    volumes:
      - ./data:/data
      - ./custom:/custom:ro
    networks:
      media-net:
        aliases:
          - roguedashboard
          - rogue-dashboard
          - dash
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      rogue.dashboard.protected: "true"
      rogue.product: "RogueDashboard"

networks:
  media-net:
    external: true
    name: ${MEDIA_NETWORK:-media-net}
