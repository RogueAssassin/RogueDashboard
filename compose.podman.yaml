services:
  dashboard:
    image: ${RGDASH_IMAGE:-ghcr.io/rogueassassin/rogue-dashboard:1.1.3}
    container_name: rogue-dashboard
    restart: always
    stop_grace_period: 15s
    env_file:
      - .env
    environment:
      PORT: 8080
      DATA_DIR: /data
      STATIC_DIR: /app/static
      CUSTOM_DIR: /custom
    ports:
      - "${RGDASH_PORT:-7805}:8080"
    volumes:
      - ./data:/data
      - ./custom:/custom:ro
    networks:
      media-net:
        aliases:
          - rogue-dashboard
          - dash
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      rogue.dashboard.protected: "true"

networks:
  media-net:
    external: true
    name: ${MEDIA_NETWORK:-media-net}
