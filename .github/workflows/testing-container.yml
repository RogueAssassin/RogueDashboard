name: Publish testing container

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: roguedashboard-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate Python
        run: python -m compileall -q app
      - name: Validate unified Compose
        run: |
          cp .env.example .env
          docker network create media-net >/dev/null 2>&1 || true
          docker compose --env-file .env -f compose.yaml config -q
      - name: Validate container build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: roguedashboard:testing-validation
          build-args: RGDASH_VERSION=1.2.0

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Testing metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/rogueassassin/roguedashboard
            ghcr.io/rogueassassin/rogue-dashboard
          tags: |
            type=raw,value=testing
            type=raw,value=1.2.0-testing
            type=sha
      - name: Build and publish testing images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RGDASH_VERSION=1.2.0
          provenance: mode=max
          sbom: true
