name: Publish stable container

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION = "\([0-9][0-9.]*\)"/\1/p' app/dashboard.py)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and validate
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q app
          cp .env.example .env
          docker network create media-net >/dev/null 2>&1 || true
          docker compose --env-file .env -f compose.yaml config -q

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish stable image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rogueassassin/roguedashboard:${{ steps.version.outputs.version }}
            ghcr.io/rogueassassin/roguedashboard:latest
          labels: |
            org.opencontainers.image.title=RogueDashboard
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/RogueAssassin/RogueDashboard
          build-args: RGDASH_VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
