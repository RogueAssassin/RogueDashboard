name: Publish container

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run application tests
        run: python -m unittest discover -s tests -v

      - name: Validate source and Compose manifests
        run: |
          python -m compileall -q app
          cp .env.example .env
          docker network create media-net >/dev/null
          docker compose --env-file .env -f docker-compose.yaml config -q
          docker compose --env-file .env -f compose.podman.yaml config -q

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('app/dashboard.py').read_text()
          match = re.search(r'^VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$', text, re.M)
          if not match:
              raise SystemExit(1)
          print(match.group(1))
          PY
          )
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up multi-platform builder
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RGDASH_VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
