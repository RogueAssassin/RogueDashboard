name: Publish container
on:
  push:
    branches: [testing]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test and validate
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q app
          cp .env.example .env
          docker network create media-net >/dev/null 2>&1 || true
          docker compose --env-file .env -f compose.yaml config -q
          version=$(sed -n 's/^VERSION = "\([0-9][0-9.]*\)"/\1/p' app/dashboard.py)
          if [[ "$GITHUB_REF_NAME" != "testing" ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "RGDASH_VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/rogueassassin/roguedashboard
            ghcr.io/rogueassassin/rogue-dashboard
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=testing,enable=${{ github.ref_name == 'testing' }}
            type=raw,value=${{ env.RGDASH_VERSION }}-testing,enable=${{ github.ref_name == 'testing' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RGDASH_VERSION=${{ env.RGDASH_VERSION }}
          provenance: mode=max
          sbom: true
