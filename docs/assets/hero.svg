<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="t d">
<title id="t">RogueDashboard</title>
<desc id="d">RogueDashboard service monitoring banner using the approved RD artwork</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07090e"/>
    <stop offset=".52" stop-color="#0e131d"/>
    <stop offset="1" stop-color="#07131b"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#8b5cf6"/>
    <stop offset=".55" stop-color="#7c5cff"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <pattern id="hex" width="28" height="24.248" patternUnits="userSpaceOnUse">
    <path d="M7 0h14l7 12.124-7 12.124H7L0 12.124Z" fill="none" stroke="#8da0b8" stroke-opacity=".045"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
  </filter>
</defs>
<rect width="1400" height="420" rx="34" fill="url(#bg)"/>
<rect width="1400" height="420" rx="34" fill="url(#hex)"/>
<rect x="0" y="0" width="1400" height="4" rx="2" fill="url(#line)" opacity=".9"/>
<path d="M0 348C210 302 350 377 535 338S845 246 1068 291s260 17 332-12v141H0Z" fill="#22d3ee" opacity=".028"/>
<path d="M0 97C190 130 316 53 510 90s346 100 570 52 246-22 320 2V0H0Z" fill="#8b5cf6" opacity=".045"/>

<g transform="translate(56 48)" filter="url(#shadow)">
  <rect x="0" y="0" width="324" height="324" rx="72" fill="#06090f" stroke="#263142" stroke-width="2"/>
  <image href="../../app/static/branding/roguedashboard-approved.webp" x="6" y="6" width="312" height="312" preserveAspectRatio="xMidYMid slice"/>
</g>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="428" y="134" font-size="68" font-weight="850" fill="#f5f7fb" letter-spacing="-2.5">RogueDashboard</text>
  <text x="432" y="184" font-size="24" fill="#a1abb9">Fast, local-first visibility for your self-hosted services.</text>

  <g transform="translate(432 230)">
    <rect width="206" height="52" rx="12" fill="#8b5cf6" fill-opacity=".11" stroke="#8b5cf6" stroke-opacity=".42"/>
    <text x="103" y="33" text-anchor="middle" font-size="17" font-weight="750" fill="#d9d1ff">Service Monitoring</text>
    <rect x="220" width="226" height="52" rx="12" fill="#2563eb" fill-opacity=".105" stroke="#2563eb" stroke-opacity=".4"/>
    <text x="333" y="33" text-anchor="middle" font-size="17" font-weight="750" fill="#d2e0ff">RogueForge Ready</text>
    <rect x="460" width="210" height="52" rx="12" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".36"/>
    <text x="565" y="33" text-anchor="middle" font-size="17" font-weight="750" fill="#caf8ff">Docker + Podman</text>
  </g>

  <text x="432" y="334" font-size="17" fill="#7f8a9b">Health • API widgets • Local auth • Rogue ecosystem • No engine socket required</text>
